services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentsync
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- MICROSERVICES ---

  gateway-service:
    build: ./services/gateway-service
    container_name: gateway-service
    ports:
      - "5000:5000"
    env_file: ./services/gateway-service/.env
    depends_on:
      - redis

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "5001:5001"
      - "5555:5555"
    env_file: ./services/auth-service/.env
    depends_on:
      - postgres
      - redis

  job-service:
    build: ./services/job-service
    container_name: job-service
    ports:
      - "5002:5002"
    environment:
      - KAFKA_BROKER=kafka:9092
    env_file: ./services/job-service/.env
    depends_on:
      - postgres
      - redis
      - kafka

  application-service:
    build: ./services/application-service
    container_name: application-service
    ports:
      - "5003:5003"
    env_file: ./services/application-service/.env
    depends_on:
      - postgres
      - kafka

  ai-service:
    build: ./services/ai-service
    container_name: ai-service
    ports:
      - "5004:5004"
    env_file: ./services/ai-service/.env
    depends_on:
      - postgres
      - kafka

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "5005:5005"
    env_file: ./services/notification-service/.env
    depends_on:
      - kafka
